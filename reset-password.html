<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Reset Password — Lam Richter Corp.</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Syncopate:wght@400;700&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;cursor:none!important}
:root{
  --bg:#fff;--border:#d0dcea;
  --teal:#0a5c6e;--teal-dark:#074554;--teal-light:#1a8a9e;--teal-pale:#e6f5f7;
  --text:#0d1f3c;--muted:#5a6e8a;--muted2:#8fa3bc;
  --fd:'Playfair Display',serif;--fs:'Jost',sans-serif;--fh:'Syncopate',sans-serif;
}
html,body{height:100%;margin:0}
body{background:var(--teal-dark);font-family:var(--fs);font-weight:300;display:flex;align-items:center;justify-content:center;min-height:100vh;position:relative;overflow:hidden}
#cur{position:fixed;width:10px;height:10px;background:var(--teal);border-radius:50%;pointer-events:none;z-index:2147483647;transform:translate(-50%,-50%);transition:width .2s,height .2s;left:-100px;top:-100px}
#cur-ring{position:fixed;width:34px;height:34px;border:1.5px solid var(--teal);border-radius:50%;pointer-events:none;z-index:2147483646;transform:translate(-50%,-50%);opacity:.4;left:-100px;top:-100px}
.bg-letter{position:absolute;font-family:var(--fd);font-size:60vw;font-weight:400;font-style:italic;color:rgba(255,255,255,.03);pointer-events:none;user-select:none;top:50%;left:50%;transform:translate(-50%,-50%);white-space:nowrap}
.box{background:#fff;padding:72px;width:90%;max-width:600px;position:relative;z-index:2}
.box-logo{font-family:var(--fh);font-size:10px;letter-spacing:3px;color:var(--teal);display:block;margin-bottom:8px}
.box-sub{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--muted2);display:block;margin-bottom:44px}
.box-title{font-family:var(--fd);font-size:36px;font-weight:400;color:var(--text);margin-bottom:28px;line-height:1.2}
.box-title em{font-style:italic;color:var(--teal)}
.field{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
.field label{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--muted)}
.field input{border:1px solid var(--border);padding:15px 18px;font-family:var(--fs);font-size:13px;color:var(--text);outline:none;transition:border-color .2s;background:#fff;width:100%}
.field input:focus{border-color:var(--teal)}
.field input::placeholder{color:var(--muted2)}
.btn{width:100%;background:var(--teal);color:#fff;border:none;padding:16px;font-family:var(--fs);font-size:10px;letter-spacing:3px;text-transform:uppercase;margin-top:8px;transition:opacity .2s}
.btn:hover{opacity:.85}
.btn:disabled{opacity:.5}
.err{font-size:11px;color:#c0392b;margin-top:12px;display:none;letter-spacing:.5px;line-height:1.6}
.ok{font-size:11px;color:var(--teal);margin-top:12px;display:none;letter-spacing:.5px;line-height:1.6}
.back{background:none;border:none;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-top:24px;padding-top:20px;border-top:1px solid var(--border);width:100%;transition:color .2s;display:block;text-align:center}
.back:hover{color:var(--teal)}
</style>
</head>
<body>
<div id="cur"></div>
<div id="cur-ring"></div>
<div class="bg-letter">LR</div>

<div class="box">
  <span class="box-logo">Lam Richter Corp.</span>
  <span class="box-sub">Staff Portal &middot; Password Reset</span>

  <div id="form-reset">
    <h2 class="box-title">Set a new<br/><em>password.</em></h2>
    <div class="field"><label>New Password</label><input type="password" id="pass1" placeholder="Min. 8 characters"/></div>
    <div class="field"><label>Confirm Password</label><input type="password" id="pass2" placeholder="Repeat password"/></div>
    <button class="btn" id="btn-reset">Set New Password</button>
    <div class="err" id="err"></div>
    <div class="ok" id="ok"></div>
  </div>

  <button class="back" onclick="window.location.href='login.html'">&#8592; Back to Sign In</button>
</div>

<script>
var API = 'https://api.lamrichter.com';

var dot=document.getElementById('cur'),ring=document.getElementById('cur-ring');
var mx=-100,my=-100,rx=-100,ry=-100;
document.addEventListener('mousemove',function(e){mx=e.clientX;my=e.clientY;dot.style.left=mx+'px';dot.style.top=my+'px';});
(function loop(){rx+=(mx-rx)*.12;ry+=(my-ry)*.12;ring.style.left=rx+'px';ring.style.top=ry+'px';requestAnimationFrame(loop);})();

var token = new URLSearchParams(window.location.search).get('token');
if(!token){
  document.getElementById('err').textContent='Invalid reset link.';
  document.getElementById('err').style.display='block';
  document.getElementById('btn-reset').disabled=true;
}

document.getElementById('btn-reset').addEventListener('click',function(){
  var pass1=document.getElementById('pass1').value;
  var pass2=document.getElementById('pass2').value;
  var err=document.getElementById('err');
  var ok=document.getElementById('ok');
  var btn=this;
  err.style.display='none';ok.style.display='none';
  if(pass1!==pass2){err.textContent='Passwords do not match.';err.style.display='block';return;}
  if(pass1.length<8){err.textContent='Password must be at least 8 characters.';err.style.display='block';return;}
  btn.disabled=true;btn.textContent='Updating...';
  fetch(API+'/api/auth/reset-password',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({token:token,password:pass1})
  }).then(function(r){return r.json().then(function(d){return{ok:r.ok,d:d};});})
  .then(function(res){
    if(!res.ok){err.textContent=res.d.error||'Reset failed.';err.style.display='block';btn.disabled=false;btn.textContent='Set New Password';return;}
    ok.textContent='Password updated successfully. Redirecting to sign in...';ok.style.display='block';
    document.getElementById('form-reset').querySelectorAll('input,button').forEach(function(el){el.disabled=true;});
    setTimeout(function(){window.location.href='login.html';},2500);
  }).catch(function(){
    err.textContent='Could not reach the server.';err.style.display='block';
    btn.disabled=false;btn.textContent='Set New Password';
  });
});
</script>
</body>
</html>
